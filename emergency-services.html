<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emergency Services — ResQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<div class="app-shell" id="appShell">
  <div id="sidebarSlot"></div>
  <div id="navbarSlot"></div>

  <main class="main-content" id="main">
    <div class="page-header">
      <div>
        <span class="eyebrow">Get Help Fast</span>
        <h1 style="font-size:1.9rem;">Nearby Emergency Services</h1>
        <p>Hospitals, police, fire stations, and relief camps ranked by distance.</p>
      </div>
    </div>
    <div class="search-bar">

    <div class="search-input-wrapper">

        <span id="searchIcon"></span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search hospitals, police, fire..."
        >

    </div>

    <button
        class="btn btn-primary"
        id="searchBtn">
        Search
    </button>

    <button
    id="currentLocationBtn"
    class="btn btn-secondary location-btn">

    <span id="locIcon"></span>

    Current Location

</button>
</div>

    <div class="finder-layout">
      <div class="card">
        <div id="serviceMap"></div>
      </div>

      <div>
        <h3 style="margin-bottom:10px;">Nearby Emergency Services</h3>
        <div id="nearbyServiceCards">
          <div class="card place-card" data-skeleton>
            <div class="place-info">
              <span class="place-icon"></span>
              <div><h4>Loading nearby services&hellip;</h4><p style="font-size:0.85rem;">&nbsp;</p></div>
            </div>
          </div>
        </div>
      </div>
    </div>


  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=2"></script>
<script src="js/auth-guard.js"></script>
<script src="js/common.js?v=2"></script>
<script src="js/emergency-services.js"></script>
</body>
</html>
