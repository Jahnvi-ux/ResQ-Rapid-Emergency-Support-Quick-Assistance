<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shelter Finder — ResQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<div class="app-shell" id="appShell">
  <div id="sidebarSlot"></div>
  <div id="navbarSlot"></div>

  <main class="main-content" id="main">
    <div class="page-header">
      <div>
        <span class="eyebrow">Find Safety</span>
        <h1 style="font-size:1.9rem;">Shelter Finder</h1>
        <p>Locate the nearest open shelters and get directions instantly.</p>
      </div>
    </div>

    <div class="finder-search">
      <input id="searchInput" type="text" placeholder="Search by area, landmark, or shelter name..." aria-label="Search shelters">
      <button class="btn btn-secondary location-btn"><span id="locIcon"></span> Current Location</button>
      <button id="searchBtn" class="btn btn-primary"><span id="searchIcon"></span> Search</button>
    </div>

    <div class="finder-layout">

      <div class="card">
        <div id="shelterMap"></div>
      </div>

      <div>
        <!-- Shelter Details Card -->
        <div class="card" id="shelterDetails">
          <h2>🏠 Shelter Details</h2>
          <hr>
          <p>Select any green shelter marker on the map.</p>
        </div>

        <br>

        <!-- Nearby shelters populate here dynamically from OpenStreetMap/Overpass -->
        <div id="nearbyShelterCards"></div>
      </div>

    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=2"></script>
<script src="js/auth-guard.js"></script>
<script src="js/common.js?v=2"></script>
<script src="js/shelter-finder.js"></script>
</body>
</html>
